name: CI-CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # Actions 탭에서 수동 실행 버튼

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: chmod +x gradlew
      - run: ./gradlew build

      - name: JAR 저장
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar

  deploy:
    needs: build                              # build 성공 후에만 실행
    if: github.event_name != 'pull_request'   # PR에서는 배포 안 함
    runs-on: ubuntu-latest
    steps:
      - name: JAR 내려받기
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: dist

      - name: EC2로 JAR 복사
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: dist/*.jar
          target: /home/ec2-user/app
          strip_components: 1

      - name: 애플리케이션 재시작
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: /home/ec2-user/app/deploy.sh